<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Суфлёр — проба камеры</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0c10;--fg:#f3f5f7;--mut:#9aa0aa;--lime:#c8ff3c;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;background:#000}
video{width:100%;height:100%;object-fit:cover}
#live{transform:scaleX(-1)}
#prompt{position:absolute;left:0;right:0;top:0;height:34%;overflow:hidden;
  background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,.45) 75%,rgba(0,0,0,0));
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%)}
#ptext{position:absolute;left:18px;right:18px;top:100%;font-size:var(--fs,28px);font-weight:700;line-height:1.35;
  text-align:center;white-space:pre-wrap;will-change:transform}
#hud{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(0,0,0,.82),rgba(0,0,0,0))}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row label{color:var(--mut);font-size:13px;min-width:74px}
input[type=range]{flex:1;accent-color:var(--lime)}
button{border:1px solid var(--line);background:var(--glass);color:var(--fg);border-radius:999px;padding:11px 16px;font-weight:700;font-size:15px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
button.main{background:var(--lime);color:#111;border-color:var(--lime);flex:1}
button.rec{background:#ff3b5c;border-color:#ff3b5c;color:#fff;flex:1}
button:disabled{opacity:.45}
#info{font-size:12.5px;color:var(--mut);white-space:pre-line;margin-top:6px}
#count{position:absolute;inset:0;display:none;place-items:center;font-size:120px;font-weight:900;color:#fff;text-shadow:0 4px 30px #000}
#timer{position:absolute;top:calc(36% + 6px);right:14px;background:#ff3b5c;color:#fff;border-radius:999px;padding:4px 10px;font-weight:800;display:none}
#edit{position:fixed;inset:0;background:var(--bg);padding:16px;display:none;flex-direction:column;gap:10px;z-index:5}
#edit textarea{flex:1;width:100%;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:var(--fg);padding:14px;font:16px/1.45 inherit;resize:none}
#result{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:6}
#result video{flex:1;min-height:0;background:#000;object-fit:contain}
#result .pad{padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
#start{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
#start h1{font-size:24px;margin:0 0 8px}
#start p{color:var(--mut);margin:0 0 18px}
</style>
</head>
<body>
<div id="stage">
  <video id="live" playsinline muted autoplay></video>
  <div id="prompt"><div id="ptext"></div></div>
  <div id="timer">0:00</div>
  <div id="count"></div>
  <div id="start">
    <div>
      <h1>Суфлёр · проба камеры</h1>
      <p>Проверяем, как камера работает внутри Telegram:<br>качество, частота кадров, запись.</p>
      <button class="main" id="go" style="min-width:240px">Включить камеру</button>
      <div id="err" style="color:#ff8a8a;margin-top:14px;white-space:pre-line"></div>
    </div>
  </div>
  <div id="hud" style="display:none">
    <div class="row"><label>Скорость</label><input id="speed" type="range" min="10" max="120" value="45"><span id="spv" style="width:36px;text-align:right">45</span></div>
    <div class="row"><label>Шрифт</label><input id="size" type="range" min="20" max="46" value="28"></div>
    <div class="row">
      <button id="txt">Текст</button>
      <button id="flip">Камера ↺</button>
      <button class="rec" id="rec">● Запись</button>
    </div>
    <div id="info"></div>
  </div>
</div>

<div id="edit">
  <b>Текст для суфлёра</b>
  <textarea id="ta"></textarea>
  <button class="main" id="ok">Готово</button>
</div>

<div id="result">
  <video id="out" playsinline controls></video>
  <div class="pad">
    <div id="rinfo" style="white-space:pre-line;font-size:14px;margin-bottom:10px"></div>
    <div class="row"><button class="main" id="again">Переснять</button></div>
    <div id="rhint" style="color:var(--mut);font-size:12.5px;margin-top:8px">Пришлите скриншот этого экрана — по цифрам видно, годится ли камера Telegram для суфлёра.</div>
  </div>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp; try { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
const $ = id => document.getElementById(id);
const TEXT0 = "Привет! Это проба суфлёра ЧикЧик.\n\nТекст бежит сверху, рядом с камерой, — так взгляд почти не уходит от объектива.\n\nСкорость и размер можно менять ползунками прямо во время записи.\n\nКасание по тексту — пауза.\n\nКогда запись закончится, вы увидите, в каком качестве камера Telegram пишет видео.";
let text = TEXT0, stream = null, facing = "user", rec = null, chunks = [], recStart = 0, tick = null;
let y = 0, paused = false, last = 0, running = false;

$("ptext").textContent = text;
$("spv").textContent = $("speed").value;
$("speed").oninput = e => $("spv").textContent = e.target.value;
$("size").oninput = e => document.documentElement.style.setProperty("--fs", e.target.value + "px");
$("prompt").onclick = () => { paused = !paused; };
$("txt").onclick = () => { $("ta").value = text; $("edit").style.display = "flex"; };
$("ok").onclick = () => { text = $("ta").value.trim() || TEXT0; $("ptext").textContent = text; y = 0; $("edit").style.display = "none"; };

function scroll(t) {
  if (!last) last = t;
  const dt = (t - last) / 1000; last = t;
  const box = $("prompt").clientHeight, el = $("ptext");
  if (running && !paused) y += dt * Number($("speed").value);
  if (y > el.scrollHeight + box) y = 0;
  el.style.transform = `translateY(${-y}px)`;
  requestAnimationFrame(scroll);
}
requestAnimationFrame(scroll);

async function startCam() {
  $("err").textContent = "";
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    $("err").textContent = "Камера внутри этого Telegram недоступна (нет getUserMedia).\n" + navigator.userAgent; return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1080 }, height: { ideal: 1920 }, frameRate: { ideal: 30 } },
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }
    });
  } catch (e) {
    $("err").textContent = "Камеру включить не удалось:\n" + e.name + ": " + e.message; return;
  }
  $("live").srcObject = stream;
  $("live").style.transform = facing === "user" ? "scaleX(-1)" : "none";
  $("start").style.display = "none"; $("hud").style.display = "block";
  showInfo();
}

function showInfo() {
  const v = stream.getVideoTracks()[0], s = v.getSettings ? v.getSettings() : {};
  let caps = {}; try { caps = v.getCapabilities ? v.getCapabilities() : {}; } catch (e) {}
  const a = stream.getAudioTracks()[0];
  $("info").textContent =
    `Камера: ${s.width || "?"}×${s.height || "?"}, ${s.frameRate ? Math.round(s.frameRate) : "?"} кадр/с` +
    (caps.width ? ` · максимум ${caps.width.max}×${caps.height.max}` : "") +
    `\nМикрофон: ${a ? "есть" : "нет"} · запись: ${pickMime() || "не поддерживается"}`;
}

function pickMime() {
  const list = ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
  if (!window.MediaRecorder) return "";
  return list.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
}

$("go").onclick = startCam;
$("flip").onclick = () => { facing = facing === "user" ? "environment" : "user"; startCam(); };

$("rec").onclick = async () => {
  if (rec && rec.state === "recording") { rec.stop(); return; }
  const mime = pickMime();
  if (!mime) { alertBox("Запись видео в этом Telegram не поддерживается (нет MediaRecorder)."); return; }
  for (const n of [3, 2, 1]) { $("count").textContent = n; $("count").style.display = "grid"; await new Promise(r => setTimeout(r, 800)); }
  $("count").style.display = "none";
  chunks = [];
  rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
  rec.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);
  rec.onstop = finish;
  rec.start(1000);                       // кусками по секунде — так же пойдёт загрузка на сервер во время записи
  recStart = Date.now(); y = 0; running = true; paused = false;
  $("rec").textContent = "■ Стоп"; $("timer").style.display = "block";
  tick = setInterval(() => {
    const sec = Math.floor((Date.now() - recStart) / 1000);
    $("timer").textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
    if (sec >= 60) rec.stop();
  }, 250);
};

function finish() {
  clearInterval(tick); running = false;
  $("rec").textContent = "● Запись"; $("timer").style.display = "none";
  const secs = (Date.now() - recStart) / 1000;
  const blob = new Blob(chunks, { type: rec.mimeType });
  const url = URL.createObjectURL(blob), out = $("out");
  out.src = url;
  $("result").style.display = "flex";
  const mb = blob.size / 1048576;
  const s = stream.getVideoTracks()[0].getSettings();
  out.onloadedmetadata = () => {
    $("rinfo").textContent =
      `Записано: ${secs.toFixed(1)} с · ${mb.toFixed(1)} МБ · ${(mb * 8 / secs).toFixed(1)} Мбит/с\n` +
      `Кадр в файле: ${out.videoWidth}×${out.videoHeight} · камера отдавала ${s.width}×${s.height}, ${Math.round(s.frameRate || 0)} кадр/с\n` +
      `Формат: ${rec.mimeType}\n` +
      `Устройство: ${(tg && tg.platform) || "?"} · Telegram ${(tg && tg.version) || "?"}`;
  };
}

$("again").onclick = () => { $("result").style.display = "none"; $("out").removeAttribute("src"); };
function alertBox(t) { try { tg.showAlert(t); } catch (e) { alert(t); } }
</script>
</body>
</html>
